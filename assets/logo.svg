<svg width="640" height="260" viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WinWin logo">
  <title>WinWin</title>

  <!-- background: fixed light card so the mark reads correctly regardless
       of the viewer's light/dark theme -->
  <rect x="0" y="0" width="640" height="260" rx="20" fill="#F5F6F8" />

  <!-- ears -->
  <polygon points="270,62 248,8 297,54" fill="#1B2430" />
  <polygon points="271,53 259,23 286,48" fill="#2F5D8A" />
  <polygon points="370,62 392,8 343,54" fill="#1B2430" />
  <polygon points="369,53 381,23 354,48" fill="#2F5D8A" />

  <!-- face -->
  <circle cx="320" cy="118" r="64" fill="#EAF1F7" stroke="#1B2430" stroke-width="3" />

  <!-- mask -->
  <ellipse cx="294" cy="104" rx="30" ry="21" fill="#1B2430" />
  <ellipse cx="346" cy="104" rx="30" ry="21" fill="#1B2430" />

  <!-- eyes -->
  <circle cx="294" cy="106" r="10" fill="#F5F6F8" />
  <circle cx="346" cy="106" r="10" fill="#F5F6F8" />
  <circle cx="297" cy="108" r="4" fill="#1B2430" />
  <circle cx="343" cy="108" r="4" fill="#1B2430" />

  <!-- nose -->
  <polygon points="320,134 309,148 331,148" fill="#1B2430" />

  <!-- wordmark -->
  <text x="320" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="-1">
    <tspan fill="#1B2430">Win</tspan><tspan fill="#2F5D8A">Win</tspan>
  </text>
</svg>
