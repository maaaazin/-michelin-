<svg width="640" height="280" viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WinWin logo">
  <title>WinWin</title>

  <!-- background: fixed light card so the mark reads correctly regardless
       of the viewer's light/dark theme -->
  <rect x="0" y="0" width="640" height="280" rx="20" fill="#F5F6F8" />

  <!-- ears -->
  <polygon points="266,58 244,6 293,50" fill="#1B2430" />
  <polygon points="267,49 255,20 282,45" fill="#2F5D8A" />
  <polygon points="374,58 396,6 347,50" fill="#1B2430" />
  <polygon points="373,49 385,20 358,45" fill="#2F5D8A" />

  <!-- shield-shaped face: a compliance/verification badge silhouette,
       not a mascot outline - the gate concept and the raccoon identity
       share one shape instead of sitting side by side -->
  <path d="M 258,48
           L 382,48
           Q 400,48 400,66
           L 400,128
           Q 400,182 320,214
           Q 240,182 240,128
           L 240,66
           Q 240,48 258,48
           Z"
        fill="#FFFFFF" stroke="#1B2430" stroke-width="3" />

  <!-- mask band, doubling as a checkmark cut into it: the raccoon's mask
       IS the pass/verify indicator, not a decoration next to it -->
  <rect x="262" y="86" width="116" height="42" rx="21" fill="#1B2430" />
  <path d="M 286,107 L 304,123 L 354,93" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />

  <!-- wordmark -->
  <text x="320" y="258" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="-1">
    <tspan fill="#1B2430">Win</tspan><tspan fill="#2F5D8A">Win</tspan>
  </text>
</svg>
